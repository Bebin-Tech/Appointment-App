<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172b25"><meta name="description" content="BookFlow — a calmer way to run a fully booked business. Interactive appointment scheduling demo.">
<title>BookFlow · Make room for what matters</title>
<style>:root {
  --bg: #f4f6f5;
  --surface: #fff;
  --surface2: #f8faf9;
  --text: #1b3029;
  --muted: #62736b;
  --line: #e1e8e4;
  --brand: #235c45;
  --brand-hover: #174530;
  --lime: #d6ed85;
  --sidebar: #172b25;
  --side-text: #bdccc5;
  --accent: #6e5acb;
  --blue: #386c94;
  --danger: #ad3545;
  --shadow: 0 12px 40px #16392b0b;
  --radius: 12px;
  --font:
    Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
  --company: #4c7962;
}
[data-theme="dark"] {
  --bg: #101c17;
  --surface: #18271f;
  --surface2: #1e3026;
  --text: #e5efe7;
  --muted: #a6b9ad;
  --line: #32473a;
  --brand: #a9d6b6;
  --brand-hover: #cee9d4;
  --lime: #d6ed85;
  --accent: #bcabff;
  --blue: #98c9ed;
  --danger: #ff9ba9;
  --shadow: 0 12px 40px #0002;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--font);
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}
button,
a {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  color: inherit;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
summary:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid #8872f1;
  outline-offset: 3px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 30px;
  line-height: 1.2;
  letter-spacing: -1.1px;
  font-weight: 650;
}
h2 {
  font-size: 18px;
  letter-spacing: -0.35px;
  font-weight: 650;
}
h3 {
  font-size: 15px;
  font-weight: 650;
}
small,
.small {
  font-size: 12px;
}
.muted {
  color: var(--muted);
}
.mono {
  font-family: ui-monospace, monospace;
}
.icon {
  width: 19px;
  height: 19px;
  stroke: currentColor;
  stroke-width: 1.65;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 22px;
  letter-spacing: -0.8px;
  font-weight: 700;
}
.mark {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 34px;
  background: var(--lime);
  color: #172b25;
  border-radius: 9px 9px 9px 2px;
  font-size: 24px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -6px;
  padding-right: 6px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 9px 15px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  font-weight: 550;
  white-space: nowrap;
}
.btn:hover {
  background: var(--surface2);
  border-color: var(--muted);
}
.btn.primary {
  background: var(--brand);
  color: var(--surface);
  border-color: var(--brand);
}
.btn.primary:hover {
  background: var(--brand-hover);
}
.btn.lime {
  background: var(--lime);
  color: #172b25;
  border-color: var(--lime);
}
.btn.danger {
  color: var(--danger);
}
.btn.sm {
  padding: 6px 10px;
  min-height: 32px;
  font-size: 12px;
}
.iconbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  border-radius: 7px;
  width: 36px;
  height: 36px;
}
.iconbtn:hover {
  background: var(--surface2);
}
.link {
  color: var(--brand);
  font-weight: 600;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.between {
  justify-content: space-between;
}
.wrap {
  flex-wrap: wrap;
}
.stack {
  display: grid;
  gap: 16px;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.grid3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.pad {
  padding: 24px;
}
.panelhead {
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 550;
  padding: 3px 8px;
  border-radius: 5px;
  background: var(--surface2);
  color: var(--muted);
  white-space: nowrap;
}
.tag.confirmed,
.tag.active {
  background: #e6f3eb;
  color: #286b47;
}
.tag.pending,
.tag.waitlist {
  background: #fff2d6;
  color: #805a0b;
}
.tag.completed {
  background: #eaf0fc;
  color: #446290;
}
.tag.cancelled,
.tag.no-show {
  background: #fce9ec;
  color: #a02f45;
}
.tag.purple {
  background: #f0ecff;
  color: #7052af;
}
.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  font-size: 11px;
  font-weight: 650;
  background: #eae6f5;
  color: #675589;
  flex-shrink: 0;
}
.avatar.green {
  background: #deebe1;
  color: #3b6950;
}
.avatar.gold {
  background: #f2e8d7;
  color: #8b663c;
}
.avatar.blue {
  background: #ddebf0;
  color: #416c7c;
}
.subtext {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
}
.empty {
  text-align: center;
  padding: 48px 24px;
  color: var(--muted);
}
.empty .icon {
  width: 32px;
  height: 32px;
  margin-bottom: 12px;
}
.empty h3 {
  color: var(--text);
  margin-bottom: 5px;
}
.progress {
  height: 6px;
  background: var(--line);
  border-radius: 8px;
  overflow: hidden;
  margin: 10px 0;
}
.progress span {
  display: block;
  height: 100%;
  background: var(--brand);
  border-radius: 8px;
}
.pillgroup {
  display: inline-flex;
  padding: 3px;
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 7px;
  gap: 2px;
}
.pillgroup button {
  background: none;
  border: 0;
  padding: 5px 12px;
  border-radius: 4px;
  color: var(--muted);
  font-size: 12px;
}
.pillgroup button[aria-selected="true"] {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 4px #0001;
}
.field {
  display: grid;
  gap: 6px;
  margin-bottom: 16px;
}
.field label {
  font-size: 12px;
  font-weight: 600;
}
.field input,
.field select,
.field textarea,
.input {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  color: var(--text);
  padding: 10px 12px;
}
.field textarea {
  resize: vertical;
  min-height: 85px;
}
.field input[type="color"] {
  padding: 4px;
}
.field input[type="checkbox"] {
  width: 16px;
  min-height: 16px;
}
.error {
  color: var(--danger);
  font-size: 12px;
  background: var(--surface2);
  padding: 10px;
  border-radius: 6px;
  margin-bottom: 12px;
}
.error:empty {
  display: none;
}
.help {
  font-size: 12px;
  color: var(--muted);
}
.split {
  display: flex;
  gap: 24px;
}
.screenhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}
.screenhead p {
  color: var(--muted);
  margin-top: 7px;
}
.badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  display: inline-block;
}
.page {
  max-width: 1440px;
  margin: auto;
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 232px;
  background: var(--sidebar);
  color: var(--side-text);
  z-index: 30;
  display: flex;
  flex-direction: column;
  padding: 27px 16px 16px;
}
.sidebar .logo {
  color: #fff;
  margin: 0 12px 32px;
}
.sidegroup {
  font-size: 11px;
  color: #829b8e;
  padding: 16px 14px 7px;
}
.sidenav {
  display: grid;
  gap: 3px;
}
.navitem {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 13px;
  min-height: 42px;
  border-radius: 7px;
  color: var(--side-text);
  font-size: 13px;
}
.navitem:hover {
  background: #ffffff0c;
  color: #fff;
}
.navitem.active {
  background: #cce5a41a;
  color: var(--lime);
}
.navitem .count {
  margin-left: auto;
  font-size: 10px;
  background: #ffffff12;
  padding: 1px 6px;
  border-radius: 4px;
}
.sidebottom {
  margin-top: auto;
}
.planbox {
  padding: 15px;
  background: #ffffff08;
  border: 1px solid #ffffff12;
  border-radius: 8px;
  margin: 20px 6px 16px;
  font-size: 12px;
}
.planbox .progress {
  background: #ffffff1c;
}
.planbox .progress span {
  background: var(--lime);
}
.planbox .link {
  color: var(--lime);
  font-size: 12px;
}
.sideprofile {
  display: flex;
  align-items: center;
  gap: 10px;
  border-top: 1px solid #ffffff14;
  padding: 16px 10px 0;
}
.sideprofile strong {
  color: #fff;
  font-size: 12px;
}
.sideprofile .subtext {
  color: #9eb2a6;
  font-size: 10px;
}
.appmain {
  margin-left: 232px;
}
.topbar {
  height: 78px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  gap: 20px;
}
.workspace-select {
  display: flex;
  align-items: center;
  gap: 10px;
}
.workspace-icon {
  background: var(--company);
  color: #fff;
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font-weight: 700;
}
.topbar select {
  background: none;
  color: var(--text);
  border: 0;
  font-weight: 600;
  max-width: 190px;
}
.topright {
  display: flex;
  align-items: center;
  gap: 15px;
}
.search-trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 12px;
}
.search-trigger kbd {
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 10px;
}
.bell {
  position: relative;
}
.bell:after {
  content: "";
  position: absolute;
  top: 7px;
  right: 8px;
  width: 5px;
  height: 5px;
  background: var(--brand);
  border: 2px solid var(--surface);
  border-radius: 50%;
}
.content {
  padding: 32px;
  max-width: 1500px;
  margin: auto;
}
.breadcrumb {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 18px;
  display: flex;
  gap: 7px;
  align-items: center;
}
.datebadge {
  font-size: 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 11px;
  display: flex;
  gap: 7px;
  align-items: center;
}
.welcome-art {
  position: absolute;
  right: 20px;
  bottom: -25px;
  opacity: 0.25;
  width: 170px;
  height: 150px;
  transform: rotate(-12deg);
}
.welcome-art:before,
.welcome-art:after {
  content: "";
  position: absolute;
  width: 88px;
  height: 140px;
  border: 1px solid var(--brand);
  border-radius: 45px;
  transform: rotate(37deg);
  left: 25px;
}
.welcome-art:after {
  left: 75px;
  transform: rotate(-37deg);
}
.welcome {
  position: relative;
  overflow: hidden;
  background: linear-gradient(110deg, #eaf1e8, #eff3e8);
  border: 1px solid #dce6d8;
  padding: 22px 25px;
  margin-bottom: 24px;
  border-radius: 10px;
  color: #1b3a2a;
}
.welcome h2 {
  font-size: 21px;
  letter-spacing: -0.6px;
  margin-bottom: 5px;
}
.welcome p {
  color: #536f5c;
  font-size: 12px;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}
.metric {
  padding: 20px 21px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.metric-label {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.metric-label .icon {
  width: 16px;
  height: 16px;
  color: #87998e;
}
.metric-value {
  font-size: 29px;
  line-height: 1.2;
  font-weight: 650;
  letter-spacing: -1px;
  margin-top: 12px;
}
.metric-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  margin-top: 9px;
  font-size: 10px;
  color: var(--muted);
}
.metric-bottom strong {
  font-weight: 500;
  color: var(--brand);
}
.spark {
  width: 62px;
  height: 23px;
  fill: none;
  stroke: var(--brand);
  stroke-width: 1.6;
}
.dashgrid {
  display: grid;
  grid-template-columns: minmax(0, 1.85fr) minmax(280px, 1fr);
  gap: 24px;
}
.schedule-tabs {
  padding: 14px 24px 0;
}
.schedule-row {
  display: grid;
  grid-template-columns: 65px 3px minmax(0, 1fr) auto;
  gap: 15px;
  align-items: center;
  padding: 18px 24px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.schedule-row:hover {
  background: var(--surface2);
}
.schedule-row:last-child {
  border-bottom: 0;
}
.schedule-time {
  font-size: 12px;
  font-weight: 550;
}
.schedule-time small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  font-weight: 400;
}
.schedule-line {
  height: 38px;
  width: 3px;
  border-radius: 3px;
  background: #9ea6de;
}
.schedule-title {
  font-size: 13px;
  font-weight: 600;
}
.schedule-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}
.schedule-title,
.schedule-meta {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.quicklinks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 17px;
}
.quicklink {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 7px;
  font-size: 12px;
}
.quicklink:hover {
  background: var(--surface2);
  border-color: var(--muted);
}
.quicklink .icon {
  color: var(--brand);
}
.activity-item {
  position: relative;
  display: flex;
  gap: 12px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.activity-item:last-child {
  border: 0;
}
.activity-item .activity-dot {
  width: 27px;
  height: 27px;
  background: #eaf1eb;
  color: #407557;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.activity-dot .icon {
  width: 13px;
  height: 13px;
}
.activity-item p {
  line-height: 1.6;
}
.activity-item small {
  color: var(--muted);
  font-size: 10px;
}
.bookinglink {
  margin-top: 24px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 15px;
}
.bookinglink .link-icon {
  background: #edf2e8;
  color: var(--brand);
  border-radius: 8px;
  padding: 10px;
  display: flex;
}
.bookinglink .grow {
  flex: 1;
  min-width: 0;
}
.bookinglink h3 {
  font-size: 12px;
}
.bookinglink p {
  font-size: 11px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.footer-note {
  font-size: 10px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  padding: 24px 0 0;
}
.bottomnav {
  display: none;
}
.collapsed .sidebar {
  width: 76px;
  padding-left: 10px;
  padding-right: 10px;
}
.collapsed .sidebar .navlabel,
.collapsed .sidebar .sidegroup,
.collapsed .planbox,
.collapsed .sideprofile,
.collapsed .sidebar .logo-name,
.collapsed .sidebar .count {
  display: none;
}
.collapsed .sidebar .logo {
  margin-left: 11px;
}
.collapsed .appmain {
  margin-left: 76px;
}
.collapsed .navitem {
  justify-content: center;
}
.tablewrap {
  overflow: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  white-space: nowrap;
  font-size: 12px;
}
th {
  padding: 13px 18px;
  background: var(--surface2);
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
}
td {
  padding: 16px 18px;
  border-top: 1px solid var(--line);
}
td .row {
  gap: 9px;
}
td strong {
  font-weight: 600;
}
tr:hover td {
  background: var(--surface2);
}
.toolbar {
  padding: 17px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.toolbar input {
  max-width: 280px;
}
.toolbar select {
  width: auto;
}
.tablefoot {
  padding: 16px 20px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 11px;
  display: flex;
  justify-content: space-between;
}
.service-card {
  overflow: hidden;
}
.service-band {
  height: 5px;
  background: var(--company);
}
.service-card h2 {
  margin: 14px 0 5px;
}
.service-icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  background: var(--surface2);
  border-radius: 10px;
  color: var(--brand);
}
.service-detail {
  display: flex;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.service-card .btn {
  margin-top: 18px;
  width: 100%;
}
.staff-card {
  text-align: center;
  padding: 26px;
}
.staff-card .avatar {
  width: 58px;
  height: 58px;
  font-size: 18px;
  margin-bottom: 12px;
}
.staff-card .tag {
  margin: 10px 0;
}
.staff-card .btn {
  margin-top: 16px;
  width: 100%;
}
.calendar-toolbar {
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.calendar-scroll {
  overflow: auto;
}
.calendar-grid {
  display: grid;
  min-width: 730px;
  position: relative;
}
.calendar-grid.day {
  min-width: 360px;
}
.cal-heading {
  padding: 13px 5px;
  text-align: center;
  border-bottom: 1px solid var(--line);
  border-left: 1px solid var(--line);
  font-size: 10px;
  color: var(--muted);
  background: var(--surface);
}
.cal-heading strong {
  display: block;
  font-size: 20px;
  color: var(--text);
  font-weight: 500;
  margin-top: 2px;
}
.cal-heading.today strong {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  margin: 0 auto;
  border-radius: 50%;
  background: var(--brand);
  color: var(--surface);
}
.time-label {
  font-size: 10px;
  color: var(--muted);
  text-align: right;
  padding: 5px 9px;
  border-bottom: 1px solid transparent;
  height: 72px;
}
.cal-cell {
  border-left: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  min-height: 72px;
  padding: 3px;
  position: relative;
}
.cal-cell.over {
  background: #d6ed8540;
  outline: 2px dashed var(--brand);
  outline-offset: -3px;
}
.cal-cell.past {
  background: var(--surface2);
}
.cal-event {
  background: #e9e5f7;
  border-left: 3px solid #8a77c3;
  border-radius: 4px;
  padding: 6px;
  font-size: 10px;
  cursor: grab;
  position: relative;
  z-index: 1;
  overflow: hidden;
  color: #493b68;
  min-height: 57px;
  display: block;
  width: 100%;
  text-align: left;
  border-top: 0;
  border-right: 0;
  border-bottom: 0;
}
.cal-event:active {
  cursor: grabbing;
}
.cal-event strong {
  font-weight: 600;
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cal-event.green {
  background: #e3eee5;
  border-color: #719c7c;
  color: #31533c;
}
.cal-event.blue {
  background: #e3edf4;
  border-color: #71a1c2;
  color: #355770;
}
.cal-event span {
  opacity: 0.8;
  font-size: 9px;
  display: block;
  margin-top: 3px;
}
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  min-width: 700px;
}
.month-cell {
  min-height: 120px;
  border-left: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 8px;
}
.month-cell > button {
  background: none;
  border: 0;
  font-size: 12px;
  padding: 2px 5px;
}
.month-cell.today > button {
  background: var(--brand);
  color: var(--surface);
  border-radius: 50%;
}
.month-cell .cal-event {
  min-height: unset;
  margin-top: 4px;
  padding: 4px;
}
.month-cell.outside {
  opacity: 0.45;
}
.cal-tip {
  padding: 13px 20px;
  font-size: 11px;
  color: var(--muted);
  display: flex;
  gap: 8px;
  align-items: center;
}
.chart {
  height: 230px;
  display: flex;
  align-items: flex-end;
  gap: 12px;
  padding: 24px 8px 28px;
  border-bottom: 1px solid var(--line);
}
.chart-col {
  flex: 1;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-direction: column;
  gap: 8px;
  position: relative;
}
.chart-col i {
  display: block;
  width: 70%;
  background: var(--brand);
  border-radius: 4px 4px 0 0;
  min-height: 2px;
  opacity: 0.85;
}
.chart-col span {
  position: absolute;
  bottom: -22px;
  font-size: 10px;
  color: var(--muted);
}
.chart-col small {
  font-size: 10px;
}
.heatmap {
  display: grid;
  grid-template-columns: 35px repeat(9, 1fr);
  gap: 5px;
  align-items: center;
  font-size: 10px;
  color: var(--muted);
  margin-top: 20px;
}
.heatmap i {
  height: 25px;
  background: var(--brand);
  border-radius: 3px;
}
.settings-layout {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 24px;
}
.settings-nav {
  display: grid;
  align-content: start;
  gap: 5px;
}
.settings-nav a {
  padding: 9px 13px;
  border-radius: 6px;
  color: var(--muted);
}
.settings-nav a.active {
  background: var(--surface);
  color: var(--brand);
  font-weight: 600;
}
.settings-content {
  max-width: 760px;
}
.switch {
  width: 38px;
  height: 22px;
  background: var(--line);
  border: 0;
  border-radius: 20px;
  position: relative;
  flex-shrink: 0;
}
.switch:after {
  content: "";
  position: absolute;
  left: 3px;
  top: 3px;
  width: 16px;
  height: 16px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 1px 3px #0003;
}
.switch[aria-checked="true"] {
  background: var(--brand);
}
.switch[aria-checked="true"]:after {
  left: 19px;
}
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
}
.setting-row:last-child {
  border: 0;
}
.price-card {
  position: relative;
  padding: 30px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.price-card.featured {
  border: 2px solid var(--brand);
}
.price {
  font-size: 42px;
  letter-spacing: -2px;
  font-weight: 650;
  margin: 20px 0 4px;
}
.price small {
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--muted);
}
.price-card ul {
  padding: 0;
  list-style: none;
  display: grid;
  gap: 14px;
  margin: 25px 0;
  color: var(--muted);
  font-size: 13px;
}
.price-card li:before {
  content: "✓";
  color: var(--brand);
  margin-right: 9px;
}
.price-card .btn {
  width: 100%;
}
.popular {
  position: absolute;
  top: -13px;
  right: 20px;
  background: var(--brand);
  color: var(--surface);
  font-size: 10px;
  padding: 4px 12px;
  border-radius: 4px;
}
.public-page {
  max-width: 1050px;
  margin: 40px auto;
  padding: 24px;
}
.public-header {
  text-align: center;
  padding: 24px;
}
.public-header .workspace-icon {
  margin: auto;
  width: 52px;
  height: 52px;
  font-size: 24px;
  border-radius: 14px;
}
.public-header h1 {
  margin-top: 17px;
}
.booking-widget {
  display: grid;
  grid-template-columns: 290px 1fr;
  overflow: hidden;
}
.booking-intro {
  padding: 30px;
  background: var(--surface2);
  border-right: 1px solid var(--line);
}
.booking-intro .service-icon {
  background: var(--surface);
}
.booking-intro h2 {
  font-size: 24px;
  margin: 20px 0 12px;
  line-height: 1.2;
}
.booking-intro p {
  font-size: 13px;
  line-height: 1.7;
  color: var(--muted);
}
.booking-options {
  padding: 30px;
}
.booking-days {
  display: flex;
  gap: 8px;
  overflow: auto;
  padding: 12px 2px;
}
.booking-day {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 10px 14px;
  min-width: 66px;
  text-align: center;
}
.booking-day strong {
  display: block;
  font-size: 21px;
}
.booking-day small {
  color: var(--muted);
  font-size: 10px;
}
.booking-day.selected {
  background: var(--brand);
  color: var(--surface);
  border-color: var(--brand);
}
.booking-day.selected small {
  color: inherit;
}
.slots {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-top: 16px;
}
.slot {
  border: 1px solid var(--line);
  padding: 10px;
  background: var(--surface);
  border-radius: 6px;
  font-size: 12px;
}
.slot.selected {
  background: var(--brand);
  color: var(--surface);
}
.slot:hover {
  border-color: var(--brand);
}
.marketing {
  background: var(--surface);
}
.marketing-nav {
  max-width: 1200px;
  margin: auto;
  padding: 22px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.marketing-nav .row {
  gap: 28px;
  font-size: 13px;
}
.hero {
  max-width: 1200px;
  margin: auto;
  padding: 70px 32px 80px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
}
.hero h1 {
  font-size: 64px;
  line-height: 1.04;
  letter-spacing: -3px;
  max-width: 600px;
}
.hero h1 em {
  font-family: Georgia, serif;
  color: var(--brand);
  font-weight: 400;
}
.hero p {
  font-size: 16px;
  line-height: 1.8;
  color: var(--muted);
  max-width: 440px;
  margin: 25px 0;
}
.hero .hero-note {
  font-size: 11px;
  margin-top: 17px;
}
.hero-demo {
  background: var(--bg);
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 20px 25px 0 var(--lime);
}
.hero-demo h3 {
  font-size: 19px;
  margin: 16px 0 4px;
}
.marketing-section {
  padding: 75px 32px;
  max-width: 1200px;
  margin: auto;
}
.marketing-section > h2 {
  font-size: 36px;
  letter-spacing: -1.5px;
  margin-bottom: 15px;
}
.marketing-section > p {
  color: var(--muted);
  margin-bottom: 32px;
}
.feature {
  padding: 25px 0;
  border-top: 1px solid var(--line);
}
.feature .icon {
  margin-bottom: 25px;
  width: 26px;
  height: 26px;
  color: var(--brand);
}
.feature h3 {
  font-size: 19px;
  margin-bottom: 10px;
}
.feature p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
}
.trustbar {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 20px;
  padding: 28px;
  border-block: 1px solid var(--line);
  color: var(--muted);
  font-weight: 600;
  letter-spacing: -0.5px;
}
.faq {
  max-width: 750px;
}
.faq details {
  border-bottom: 1px solid var(--line);
  padding: 20px 0;
}
.faq summary {
  cursor: pointer;
  font-size: 16px;
  font-weight: 550;
}
.faq details p {
  color: var(--muted);
  margin-top: 15px;
  line-height: 1.8;
}
.cta {
  background: var(--sidebar);
  color: white;
  border-radius: 16px;
  padding: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.cta h2 {
  font-size: 30px;
}
.cta p {
  color: #b6cabd;
  margin-top: 10px;
}
.authpage {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--surface);
}
.authaside {
  background: var(--sidebar);
  color: white;
  padding: 40px 60px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.authaside h2 {
  font-size: 48px;
  line-height: 1.15;
  letter-spacing: -2px;
  max-width: 400px;
}
.authaside p {
  color: #a8c0b1;
  margin-top: 24px;
  max-width: 370px;
  font-size: 15px;
}
.authmain {
  padding: 40px;
  display: grid;
  place-items: center;
}
.authform {
  max-width: 380px;
  width: 100%;
}
.authform h1 {
  margin-bottom: 10px;
}
.authform > p {
  color: var(--muted);
  margin-bottom: 30px;
}
.authform .btn {
  width: 100%;
}
.authlinks {
  font-size: 12px;
  text-align: center;
  margin-top: 24px;
}
.steps {
  display: flex;
  gap: 8px;
  margin-bottom: 32px;
}
.steps span {
  height: 4px;
  flex: 1;
  background: var(--line);
  border-radius: 8px;
}
.steps span.active {
  background: var(--brand);
}
.onboard {
  max-width: 520px;
  margin: 48px auto;
  padding: 32px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
}
.onboard h1 {
  margin-bottom: 8px;
}
.onboard p {
  color: var(--muted);
  margin-bottom: 25px;
}
.onboard .row.between {
  margin-top: 24px;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: #07191080;
  backdrop-filter: blur(3px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal {
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 30px 100px #0003;
}
.modal.wide {
  max-width: 700px;
}
.modal-head {
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 2;
}
.modal-body {
  padding: 24px;
}
.modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 16px 24px;
  border-top: 1px solid var(--line);
}
.modal .grid2 {
  gap: 16px;
}
.toast-region {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 200;
  display: grid;
  gap: 8px;
  max-width: min(420px, calc(100vw - 32px));
}
.toast {
  background: var(--sidebar);
  border: 1px solid #476354;
  color: #fff;
  padding: 13px 16px;
  border-radius: 9px;
  box-shadow: 0 8px 30px #0002;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
}
.toast button {
  border: 0;
  background: none;
  color: var(--lime);
  font-size: 12px;
  font-weight: 600;
}
.toast .icon {
  color: var(--lime);
  width: 17px;
}
.command-input {
  border: 0;
  border-bottom: 1px solid var(--line);
  padding: 20px 24px;
  background: var(--surface);
  color: var(--text);
  width: 100%;
  font-size: 16px;
}
.command-results {
  padding: 8px;
  max-height: 350px;
  overflow: auto;
}
.command-result {
  display: flex;
  gap: 12px;
  align-items: center;
  text-align: left;
  width: 100%;
  background: none;
  border: 0;
  border-radius: 6px;
  padding: 12px;
}
.command-result:hover,
.command-result:focus {
  background: var(--surface2);
}
.command-result small {
  margin-left: auto;
  color: var(--muted);
}
.skeleton {
  height: 110px;
  background: linear-gradient(90deg, var(--line), var(--surface2), var(--line));
  border-radius: 10px;
}
.skeleton:nth-child(2) {
  height: 300px;
  margin-top: 24px;
}
.restricted {
  max-width: 480px;
  margin: 60px auto;
  text-align: center;
  padding: 32px;
}
.notification-list {
  max-height: 400px;
  overflow: auto;
}
.divider {
  height: 1px;
  background: var(--line);
  margin: 24px 0;
}
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
code {
  background: var(--surface2);
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 5px;
  display: block;
  overflow-wrap: anywhere;
  font-size: 11px;
}
.skip {
  position: fixed;
  top: -60px;
  left: 20px;
  background: var(--brand);
  color: var(--surface);
  padding: 10px;
  z-index: 300;
}
.skip:focus {
  top: 10px;
}
.mobile-only {
  display: none;
}
.metric,
.panel,
.appmain,
.dashgrid > * {
  min-width: 0;
}
.tablewrap {
  position: relative;
}
h1,
h2,
h3 {
  overflow-wrap: anywhere;
}
.metrics {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}
.month-cell.over {
  background: #d6ed8540;
  outline: 2px dashed var(--brand);
  outline-offset: -3px;
}
@media (min-width: 701px) and (max-width: 1000px) {
  .metrics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .screenhead {
    flex-wrap: wrap;
  }
  .topbar {
    gap: 8px;
  }
  .topbar .row {
    gap: 6px;
  }
  .topbar select {
    max-width: 150px;
  }
}
@media (prefers-reduced-motion: no-preference) {
  .toast,
  .modal {
    animation: enter 0.18s ease-out;
  }
  @keyframes enter {
    from {
      transform: translateY(8px);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }
  .btn,
  .navitem {
    transition: background 0.15s;
  }
}
@media (min-width: 1600px) {
  .content {
    padding: 40px 48px;
  }
  .topbar {
    padding: 0 48px;
  }
}
@media (max-width: 1150px) {
  .sidebar {
    width: 205px;
  }
  .appmain {
    margin-left: 205px;
  }
  .content {
    padding: 24px;
  }
  .topbar {
    padding: 0 24px;
  }
  .dashgrid {
    grid-template-columns: minmax(0, 1.5fr) minmax(250px, 1fr);
  }
  .metric {
    padding: 16px;
  }
  .metrics {
    gap: 12px;
  }
  .metric-bottom {
    flex-wrap: wrap;
  }
  .spark {
    display: none;
  }
  .hero h1 {
    font-size: 52px;
  }
  .hero {
    gap: 32px;
  }
  .grid3 {
    gap: 14px;
  }
  .schedule-row {
    gap: 10px;
    padding: 16px;
  }
  .schedule-tabs {
    padding-left: 16px;
  }
  .booking-widget {
    grid-template-columns: 250px 1fr;
  }
}
@media (max-width: 900px) {
  .dashgrid {
    grid-template-columns: 1fr;
  }
  .dash-side {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .dash-side > .panel {
    margin: 0 !important;
  }
  .grid3 {
    grid-template-columns: repeat(2, 1fr);
  }
  .hero {
    grid-template-columns: 1fr;
    gap: 48px;
    max-width: 700px;
  }
  .hero h1 {
    font-size: 60px;
  }
  .hero-demo {
    max-width: 500px;
  }
  .authaside {
    padding: 32px;
  }
  .authaside h2 {
    font-size: 38px;
  }
  .topright {
    gap: 5px;
  }
  .search-trigger span {
    display: none;
  }
  .settings-layout {
    grid-template-columns: 140px 1fr;
    gap: 16px;
  }
  .grid2 {
    gap: 16px;
  }
  .booking-widget {
    grid-template-columns: 1fr;
  }
  .booking-intro {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .booking-intro h2 {
    margin: 10px 0;
  }
  .marketing-nav .row {
    gap: 14px;
  }
}
@media (max-width: 700px) {
  .sidebar {
    display: none;
  }
  .appmain,
  .collapsed .appmain {
    margin-left: 0;
  }
  .topbar {
    height: 64px;
    padding: 0 16px;
    gap: 8px;
  }
  .topbar select {
    max-width: 150px;
    font-size: 12px;
  }
  .topright {
    gap: 2px;
  }
  .search-trigger kbd {
    display: none;
  }
  .content {
    padding: 22px 16px 95px;
  }
  .screenhead {
    align-items: flex-start;
    gap: 12px;
  }
  .screenhead h1 {
    font-size: 25px;
  }
  .screenhead p {
    font-size: 12px;
  }
  .screenhead .btn {
    font-size: 12px;
    padding: 8px 11px;
    min-height: 36px;
  }
  .screenhead > .row .datebadge {
    display: none;
  }
  .breadcrumb {
    display: none;
  }
  .welcome {
    padding: 20px;
    margin-top: 0;
  }
  .welcome h2 {
    font-size: 19px;
  }
  .welcome p {
    max-width: 220px;
  }
  .welcome-art {
    right: -20px;
  }
  .metrics {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .metric {
    padding: 16px;
  }
  .metric-value {
    font-size: 27px;
  }
  .metric-label {
    font-size: 11px;
  }
  .dash-side {
    display: block;
  }
  .dash-side > .panel {
    margin-bottom: 20px !important;
  }
  .dashgrid {
    gap: 20px;
  }
  .schedule-row {

function icon(name){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[name]||icons.calendar}"/></svg>`}

const zones=['Asia/Kolkata','America/New_York','America/Los_Angeles','Europe/London','Europe/Paris','Asia/Singapore','Australia/Sydney','UTC'];
const localZone=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'; if(!zones.includes(localZone))zones.unshift(localZone);
const dateKey=(date=new Date(),zone=localZone)=>new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit'}).format(date);
function parts(iso,zone){const f=new Intl.DateTimeFormat('en-GB',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(iso));const p=Object.fromEntries(f.map(x=>[x.type,x.value]));return {date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}`}}

function fmtDate(date,opts={month:'short',day:'numeric'}){return new Intl.DateTimeFormat('en-US',{...opts,timeZone:'UTC'}).format(new Date(date+'T12:00:00Z'))}
function fmtTime(iso,zone=displayZone()){return new Intl.DateTimeFormat('en-US',{timeZone:zone,hour:'numeric',minute:'2-digit'}).format(new Date(iso))}

function seedWorkspace(id,name,color,plan='Pro'){

 const clients=['Alex Morgan','Sophie Williams','Daniel Park','Emma Davis','Noah Thompson','Isabella Rossi','Lucas Martin','Ava Patel'].map((name,i)=>({id:id+'-c'+i,name,email:name.toLowerCase().replaceAll(' ','.')+'@example.com',tags:i%3===0?['VIP']:i%2===0?['Returning']:['New'],notes:i===0?'Prefers morning appointments. Interested in a brand refresh.':''}));
 const today=dateKey(new Date(),localZone);const bookings=[];
 for(let d=-18;d<=9;d++){const day=addDays(today,d);if([0,6].includes(new Date(day+'T12:00Z').getUTCDay()))continue;[9,10,11,13,14,15].forEach((h,j)=>{if(d!==0&&(j+d+40)%3===0)return;const st=staff[j%3];const svc=services[j%3];const start=wallISO(day,`${String(h).padStart(2,'0')}:${j===1?'30':'00'}`,localZone);bookings.push({id:uid(),clientId:clients[(j+d+80)%8].id,serviceId:svc.id,staffId:st.id,start,duration:svc.duration,price:svc.price,status:d<0?((j+d+50)%13===0?'no-show':'completed'):j===4?'pending':'confirmed',recurring:false,notes:''})})}
 return {id,name,color,slug:name.toLowerCase().replaceAll(' ','-'),plan,timezone:localZone,hours:{start:'09:00',end:'18:00',days:[1,2,3,4,5]},staff,services,clients,bookings,waitlist:[],invites:[],keys:[],integrations:{google:false,zoom:false,stripe:false},notifications:{email:true,reminders:true,digest:false},activity:[{id:uid(),text:'Alex Morgan booked a design consultation',time:Date.now()-8*60000},{id:uid(),text:'James Wilson joined your workspace',time:Date.now()-37*60000},{id:uid(),text:'Your booking page is ready to share',time:Date.now()-70*60000}],audit:[]};
}

// Scheduling domain: all times are instants. Working hours are wall times in the
// workspace timezone. Buffers on both adjacent bookings participate in conflicts.
function schedulingError(b,ignoreId='',batch=[]){const w=ws(),s=service(b.serviceId),person=w.staff.find(x=>x.id===b.staffId);if(!person)return 'Choose an available team member.';const start=Date.parse(b.start);if(!Number.isFinite(start))return 'Choose a valid date and time.';if(start<Date.now())return 'That time has already passed. Choose a future time.';const end=start+b.duration*60000;const p=parts(start,w.timezone),ep=parts(end,w.timezone);const weekday=new Date(p.date+'T12:00Z').getUTCDay();if(!w.hours.days.includes(weekday)||!person.days.includes(weekday))return 'Your team member is not working that day. Choose another day.';if(p.date!==ep.date||p.time<w.hours.start||p.time<person.start||ep.time>w.hours.end||ep.time>person.end)return 'That appointment falls outside working hours. Choose another time.';const blocked=[...w.bookings,...batch].some(other=>{if(other.id===ignoreId||other.staffId!==b.staffId||['cancelled','no-show'].includes(other.status))return false;const os=Date.parse(other.start),oe=os+other.duration*60000;return start<oe+(service(other.serviceId).buffer||0)*60000&&end+(s.buffer||0)*60000>os});if(blocked)return 'That time overlaps another appointment or its buffer. Choose an open time.';return ''}
function usageError(bookings){const w=ws(),limit=plans[w.plan].bookings,counts={};w.bookings.filter(b=>b.status!=='cancelled').forEach(b=>{const m=parts(b.start,w.timezone).date.slice(0,7);counts[m]=(counts[m]||0)+1});for(const b of bookings){const m=parts(b.start,w.timezone).date.slice(0,7);counts[m]=(counts[m]||0)+1;if(counts[m]>limit)return `Your ${w.plan} plan’s monthly booking limit is reached for ${m}. Upgrade in Settings → Billing.`}return ''}
function availableSlots(s,person,date,zone){if(!person)return [];const result=[];for(let hour=0;hour<24;hour++)for(const min of [0,30]){const time=String(hour).padStart(2,'0')+':'+String(min).padStart(2,'0');try{const start=wallISO(date,time,zone);if(!schedulingError({id:'new',start,duration:s.duration,serviceId:s.id,staffId:person.id}))result.push(time)}catch(e){/* DST gap is not a valid slot. */}}return result}

function saveBookings(data,form){const id=data.id,b=ws().bookings.find(x=>x.id===id);if(b&&!canEdit(b))throw Error('You cannot edit this booking.');if(!b&&role()==='Staff'&&data.staffId!==me()?.id)throw Error('Staff can book their own calendar only.');if(role()==='Client'&&data.clientId!==myClient()?.id)throw Error('You can book for your own client profile only.');const s=ws().services.find(s=>s.id===data.serviceId);if(!s||!ws().clients.some(c=>c.id===data.clientId))throw Error('Select a valid service and client.');if(data.repeat!=='none'&&data.repeat&&ws().plan==='Free'){upgrade('Recurring bookings');return}const count=!b&&data.repeat!=='none'?Number(data.count):1;if(!Number.isInteger(count)||count<1||count>12)throw Error('Choose between 2 and 12 recurring appointments.');const batch=[];for(let i=0;i<count;i++){const date=addDays(data.date,i*(data.repeat==='fortnightly'?14:7));const next={id:b?.id||uid(),clientId:data.clientId,serviceId:s.id,staffId:data.staffId,start:wallISO(date,data.time,data.zone),duration:s.duration,price:s.price,status:b?.status==='cancelled'?'confirmed':b?.status||'confirmed',notes:data.notes||'',recurring:count>1||b?.recurring||false};const err=schedulingError(next,id,batch);if(err)throw Error((count>1?`Appointment ${i+1}: `:'')+err);batch.push(next)}if(!b){const err=usageError(batch);if(err)throw Error(err)}else{const prior=ws().bookings;ws().bookings=prior.filter(x=>x.id!==id);const err=usageError(batch);ws().bookings=prior;if(err)throw Error(err)}if(b)Object.assign(b,batch[0]);else ws().bookings.push(...batch);log(b?'Rescheduled '+client(data.clientId).name+'’s appointment':`Created ${batch.length} appointment${batch.length>1?'s':''} for ${client(data.clientId).name}`);persist();closeModal();render();toast(b?'Appointment rescheduled':batch.length>1?`${batch.length} recurring appointments created`:'You’re booked. A little more flow.');}

document.addEventListener('change',e=>{const el=e.target,a=el.dataset.change;if(!a)return;switch(a){case'workspace':Store.state.active=el.value;UI.selected.clear();UI.zone='';UI.filter='all';UI.staffFilter='all';UI.query='';UI.publicService='';UI.publicStaff='';UI.publicTime='';persist();render();toast('Switched to '+ws().name);break;case'role':Store.state.role=el.value;UI.selected.clear();persist();closeModal();if(!allowed(route()))go('dashboard');render();toast('Exploring as '+role());break;case'status-filter':UI.filter=el.value;UI.selected.clear();render();break;case'staff-filter':UI.staffFilter=el.value;UI.selected.clear();render();break;case'select-booking':el.checked?UI.selected.add(el.value):UI.selected.delete(el.value);render();break;case'select-all':{const ids=$$('tbody input[data-change=select-booking]').map(x=>x.value);ids.forEach(id=>el.checked?UI.selected.add(id):UI.selected.delete(id));render();break}case'cal-zone':UI.zone=el.value;render();break;case'public-service':UI.publicService=el.value;UI.publicTime='';render();break;case'public-staff':UI.publicStaff=el.value;UI.publicTime='';render();break;case'public-zone':UI.publicZone=el.value;UI.publicTime='';render();break;case'public-date':if(!/^\d{4}-\d{2}-\d{2}$/.test(el.value))return;UI.publicDate=el.value;UI.publicTime='';render();break;}});

'onboarding':{Object.assign(UI.draft,data);if(UI.onboardStep===3){const days=new FormData(form).getAll('days').map(Number);if(data.start>=data.end||!days.length)throw Error('Choose valid working hours and at least one working day.');UI.draft.days=days;const d=UI.draft,id=uid();if(!d.company?.trim())throw Error('Please go back and enter a company name.');const w=seedWorkspace(id,d.company.trim(),d.color,'Free');w.timezone=d.timezone;w.hours={start:d.start,end:d.end,days};w.bookings=[];w.clients=[{id:uid(),name:Store.state.profile.name,email:Store.state.profile.email,tags:['New'],notes:''}];w.staff=[{id:uid(),name:Store.state.profile.name,email:Store.state.profile.email,role:'Owner',start:d.start,end:d.end,days}];w.services=[{id:uid(),name:d.service.trim(),duration:Number(d.duration),price:Number(d.price),buffer:15,description:'A little time to connect.',color:'green'}];w.activity=[{id:uid(),text:'Your workspace is ready. Welcome to BookFlow!',time:Date.now()}];Store.state.workspaces.push(w);Store.state.active=w.id;Store.state.role='Owner';UI.publicService='';UI.publicStaff='';UI.selected.clear();UI.zone='';persist();go('dashboard');toast('Your workspace is ready. Find your flow.')}else{UI.onboardStep++;render()}break}case'public-book':{const s=ws().services.find(s=>s.id===UI.publicService)||ws().services[0],st=ws().staff.find(s=>s.id===UI.publicStaff)||ws().staff[0];if(!UI.publicTime)throw Error('Choose a time first.');const b={id:uid(),serviceId:s.id,staffId:st.id,start:wallISO(UI.publicDate,UI.publicTime,UI.publicZone),duration:s.duration,price:s.price,status:'confirmed',notes:'Booked through public page',recurring:false};const err=schedulingError(b)||usageError([b]);if(err)throw Error(err);let c=ws().clients.find(c=>c.email.toLowerCase()===data.email.toLowerCase());if(!data.name.trim())throw Error('Please enter your name.');if(!c){c={id:uid(),name:data.name.trim(),email:data.email.trim(),tags:['New'],notes:''};ws().clients.push(c)}b.clientId=c.id;ws().bookings.pus document.addEventListener('drop',e=>{const cell=e.target.closest('[data-drop-date]');if(!cell)return;e.preventDefault();cell.classList.remove('over');const b=ws().bookings.find(x=>x.id===e.dataTransfer.getData('text/bookflow'));if(!b||!canEdit(b)||role()==='Client')return;try{const old=b.start;const time=UI.calView==='month'?parts(b.start,displayZone()).time:cell.dataset.dropTime;const next={...b,start:wallISO(cell.dataset.dropDate,time,displayZone())};const err=schedulingError(next,b.id);if(err)return toast(err);const other=ws().bookings;ws().bookings=other.filter(x=>x.id!==b.id);const limit=usageError([next]);ws().bookings=other;if(limit)return toast(limit);b.start=next.start;log('Moved '+client(b.clientId).name+'’s appointment');persist();render();toast('Moved to '+fmtDate(parts(b.start,displayZone()).date)+' · '+fmtTime(b.start),'Undo',()=>{const check=schedulingError({...b,start:old},b.id);if(check)return toast('Cannot undo: '+check);b.start=old;log('Undid appointment move');persist();render();toast('Move undone')})}catch(err){toast(err.message)}});
let shortcutPrefix='';document.addEventListener('keydown',e=>{const inField=['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commandPalette();return}if($('.modal')){if(e.key==='Escape'){e.preventDefault();closeModal();return}const focusables=$$('a[href],button:not(:disabled),input,select,textarea,[tabindex="0"]',$('.modal')).filter(x=>x.getClientRects().length);if(e.key==='Tab'&&focusables.length){const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if($('#command')&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const items=$$('.command-result');let index=items.indexOf(document.activeElement);index=e.key==='ArrowDown'?(index+1)%items.length:(index-1+items.length)%items.length;items[index]?.focus()}return}if(inField||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Enter'&&e.target.matches('[role=button],.cal-cell')){e.preventDefault();e.target.click();return}if(e.key==='n'&&allowed('bookings')){e.preventDefault();bookingForm()}if(shortcutPrefix==='g'){const routes={c:'calendar',d:'dashboard',b:'bookings'};if(routes[e.key]&&allowed(routes[e.key]))go(routes[e.key]);shortcutPrefix=''}else if(e.key==='g'){shortcutPrefix='g';setTimeout(()=>shortcutPrefix='',1000)}});
